[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonos-firmware-archive"
version = "0.1.0"
description = "Catalog and analysis tooling for archived Sonos firmware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "cryptography>=41",
  "curl-cffi>=0.13",
  "jsonschema>=4.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = []
google-play = [
  "goopdl @ git+https://github.com/Villoh/goopdl.git@b66bf60d686fd93724b7c9f1963fe8bf4070b89d",
]

[project.scripts]
sonos-fw = "sonos_firmware.cli:main"
sonos-archive = "sonos_firmware.platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
