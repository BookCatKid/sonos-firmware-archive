[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "sonos-firmware-archive"
version = "0.1.0"
description = "Catalog and analysis tooling for archived Sonos firmware"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
  "cryptography>=50",
  "curl-cffi>=0.17",
  "jsonschema>=4.26",
  "PyYAML>=6.0.4",
  "warcio>=1.8.2",
]

[project.optional-dependencies]
test = []
google-play = [
  "goopdl @ git+https://github.com/Villoh/goopdl.git@b66bf60d686fd93724b7c9f1963fe8bf4070b89d",
]

[project.scripts]
sonos-fw = "sonos_firmware.cli:main"
sonos-archive = "sonos_firmware.platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
