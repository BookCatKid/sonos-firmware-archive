name: build smart application diffs

on:
  workflow_run:
    workflows:
      - automatically preserve detected Sonos software
    types:
      - completed
  schedule:
    - cron: "41 8 * * 0"
  workflow_dispatch:
    inputs:
      per_family:
        description: Missing adjacent macOS pairs to analyze per family
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: smart-application-diffs
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install archive tooling
        run: python -m pip install -e .

      - name: Analyze newest preserved macOS release pairs
        if: github.event_name == 'workflow_run'
        run: python scripts/generate_macos_smart_diffs.py --latest-only

      - name: Backfill missing macOS semantic diffs
        if: github.event_name != 'workflow_run'
        env:
          PAIRS_PER_FAMILY: ${{ inputs.per_family || '1' }}
        run: python scripts/generate_macos_smart_diffs.py --per-family "$PAIRS_PER_FAMILY"

      - name: Validate generated viewer data
        run: |
          python scripts/build_site.py --check
          python -m unittest tests.test_site_build -v

      - name: Commit semantic diff metadata
        run: |
          if git diff --quiet -- data/app-diffs; then
            echo "No new application semantic diffs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/app-diffs
          git commit -m "Add smart application diffs"
          git push
