name: monitor firmware sources

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-firmware-sources
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Check current public sources
        id: check
        shell: bash
        run: |
          set +e
          python scripts/check_new_versions.py --output monitor-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Expand cataloged firmware directories
        id: directory_check
        shell: bash
        run: |
          set +e
          python scripts/check_catalog_firmware_directories.py \
            --output catalog-directory-monitor-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_release_assets.py --output release-asset-audit.json
      - name: Check for new desktop app installers
        id: app_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/check_new_desktop_apps.py \
            --output desktop-app-monitor-report.json \
            --discovery-output desktop-app-discovery.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Check for new official mobile APKs
        id: mobile_app_check
        shell: bash
        run: |
          set +e
          python scripts/check_new_mobile_apps.py \
            --output mobile-app-monitor-report.json \
            --discovery-output mobile-app-discovery.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Check official Google Play listings
        id: google_play_check
        shell: bash
        run: |
          set +e
          python scripts/check_new_google_play_apps.py \
            --output google-play-monitor-report.json \
            --discovery-output google-play-discovery.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Check public Sonos web deployments
        id: web_app_check
        shell: bash
        run: |
          set +e
          python scripts/check_new_web_apps.py --output web-app-monitor-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firmware-monitor-report
          path: |
            monitor-report.json
            catalog-directory-monitor-report.json
            release-asset-audit.json
            desktop-app-monitor-report.json
            desktop-app-discovery.json
            mobile-app-monitor-report.json
            mobile-app-discovery.json
            google-play-monitor-report.json
            google-play-discovery.json
            web-app-monitor-report.json
          retention-days: 30
      - name: Open or update discovery issue
        if: steps.check.outputs.exit_code == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('monitor-report.json', 'utf8'));
            const title = '[monitor] New Sonos firmware evidence detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fmt = list => list.length > 1 ? `${list.slice(0, -1).join(', ')} and ${list.at(-1)}` : `${list[0]}`;
            const unknownVersions = report.unknown_versions ?? [];
            const releaseNoteVersions = report.unknown_release_note_versions ?? [];
            const newManifests = (report.unknown_manifest_urls?.length ?? 0) + (report.unknown_manifest_hashes?.length ?? 0);
            const newDownloads = report.available_uncatalogued_candidates?.length ?? 0;
            const recovered = report.known_missing_now_available?.length ?? 0;
            const findings = [];
            if (unknownVersions.length) findings.push(`New Sonos firmware: ${fmt(unknownVersions)}.`);
            if (releaseNoteVersions.length) findings.push(`Sonos release notes now list ${fmt(releaseNoteVersions)}.`);
            if (newManifests) findings.push(`Sonos published ${newManifests} new update ${newManifests === 1 ? 'list' : 'lists'}.`);
            if (newDownloads) findings.push(`Found ${newDownloads} new firmware ${newDownloads === 1 ? 'file' : 'files'} ready to download.`);
            if (recovered) findings.push(`${recovered} previously missing ${recovered === 1 ? 'download works' : 'downloads work'} again.`);
            if (!newDownloads && !recovered) findings.push('No new downloads found.');
            const details = [
              ...findings,
              ``,
              `Review the full JSON report artifact in [workflow run ${context.runNumber}](${runUrl}).`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              // A release-note-only version stays unknown until its binary is
              // archived. Repeated observations are not new discoveries.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 100,
              });
              const lastMonitorComment = comments
                .filter(comment => comment.user?.login === 'github-actions[bot]')
                .at(-1);
              const evidence = body => (body ?? '').split('Review the full JSON report artifact in ')[0].trim();
              if (evidence(lastMonitorComment?.body ?? existing.body) !== evidence(details)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: details,
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: details,
              });
            }
      - name: Fail on monitoring errors
        if: steps.check.outputs.exit_code == '1' || steps.directory_check.outputs.exit_code == '1' || steps.app_check.outputs.exit_code == '1' || steps.mobile_app_check.outputs.exit_code == '1' || steps.google_play_check.outputs.exit_code == '1' || steps.web_app_check.outputs.exit_code == '1'
        run: exit 1
      - name: Open or update catalog-directory discovery issue
        if: steps.directory_check.outputs.exit_code == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('catalog-directory-monitor-report.json', 'utf8'));
            const title = '[monitor] Cataloged Sonos directory exposes new speaker firmware';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fmt = list => list.length > 1 ? `${list.slice(0, -1).join(', ')} and ${list.at(-1)}` : `${list[0]}`;
            const versions = [...new Set((report.uncatalogued_available ?? [])
              .map(x => (x.filename ?? '').split('-').slice(0, 2).join('-'))
              .filter(v => v))];
            const total = report.uncatalogued_available_total ?? versions.length;
            const details = [
              `Found ${total} new downloadable speaker firmware ${total === 1 ? 'file' : 'files'} for ${versions.length ? fmt(versions) : 'known download folders'}.`,
              ``,
              `Review the JSON evidence in [workflow run ${context.runNumber}](${runUrl}).`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: details});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title, body: details});
            }
      - name: Open or update desktop-app discovery issue
        if: steps.app_check.outputs.exit_code == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('desktop-app-monitor-report.json', 'utf8'));
            const title = '[monitor] New Sonos desktop installer detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const found = [
              ...(report.unknown_installers ?? []).map(x => `New Sonos desktop installer: ${x.family}/${x.platform} ${x.version} (${x.url}).`),
              ...(report.unknown_direct_redirects ?? []).map(x => `New Sonos desktop download: ${x.name} (${x.location}).`),
            ];
            const details = [
              ...found.slice(0, 10),
              ...(found.length > 10 ? [`And ${found.length - 10} more in the workflow run.`] : []),
              ``,
              `Review the full JSON receipts in [workflow run ${context.runNumber}](${runUrl}).`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: details,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body: details,
              });
            }
      - name: Open or update mobile-app discovery issue
        if: steps.mobile_app_check.outputs.exit_code == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('mobile-app-monitor-report.json', 'utf8'));
            const title = '[monitor] New official Sonos mobile APK detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const found = (report.unknown_installers ?? []).map(x => `New Sonos Android app build: ${x.family} ${x.version} (${x.url}).`);
            const details = [
              ...found.slice(0, 10),
              ...(found.length > 10 ? [`And ${found.length - 10} more in the workflow run.`] : []),
              ``,
              `Review the full JSON receipts in [workflow run ${context.runNumber}](${runUrl}).`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: details});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title, body: details});
            }
      - name: Open or update Google Play discovery issue
        if: steps.google_play_check.outputs.exit_code == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('google-play-monitor-report.json', 'utf8'));
            const title = '[monitor] Sonos Google Play listing changed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const found = (report.changed_listings ?? []).map(x =>
              `The ${x.package} Google Play listing was updated on ${x.updated_on ?? 'an unknown date'}: ${x.url}`);
            const details = [
              ...found, ``,
              `Review the JSON evidence in [workflow run ${context.runNumber}](${runUrl}).`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: details});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title, body: details});
            }
      - name: Open or update web-deployment discovery issue
        if: steps.web_app_check.outputs.exit_code == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('web-app-monitor-report.json', 'utf8'));
            const title = '[monitor] Sonos web deployment changed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fmt = list => list.length > 1 ? `${list.slice(0, -1).join(', ')} and ${list.at(-1)}` : `${list[0]}`;
            const apps = (report.changed_deployments ?? []).map(x => x.app);
            const details = [
              `The public Sonos web app changed: ${apps.length ? fmt(apps) : 'unknown app'}.`,
              ``,
              `Review the JSON evidence in [workflow run ${context.runNumber}](${runUrl}).`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: details});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title, body: details});
            }
